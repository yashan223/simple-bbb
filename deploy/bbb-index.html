<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PulseEdu Meeting</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f8fafc;
            color: #0f172a;
            display: flex;
            min-height: 100vh;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 20px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.03);
            max-width: 480px;
            width: 100%;
            padding: 40px 32px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .logo-img {
            height: 56px;
            width: auto;
            object-fit: contain;
            margin-bottom: 24px;
        }
        .reason-box {
            background-color: #f1f5f9;
            border: 1px solid #cbd5e1;
            color: #334155;
            padding: 12px 18px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 24px;
            word-break: break-word;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background-color: #4f46e5;
            color: #ffffff;
            font-weight: 600;
            font-size: 14px;
            padding: 12px 24px;
            border-radius: 10px;
            text-decoration: none;
            transition: background-color 0.15s ease;
            box-shadow: 0 4px 6px -1px rgba(79, 70, 229, 0.2);
        }
        .btn:hover {
            background-color: #4338ca;
        }
        .error-div {
            background-color: #fef2f2;
            border: 1px solid #fecaca;
            color: #b91c1c;
            padding: 14px 18px;
            border-radius: 12px;
            font-size: 13px;
            margin-bottom: 20px;
            text-align: left;
            width: 100%;
        }
        .error-message {
            margin-top: 4px;
        }
    </style>
</head>
<body>
    <div class="card">
        <img src="/logo-wide.png" alt="PulseEdu" class="logo-img" onerror="this.src='https://meeting.pulseedu.online/logo-wide.png'" />
        
        <h2 id="card-heading" style="font-size: 20px; font-weight: 700; color: #0f172a; margin-bottom: 14px;">Session Ended</h2>

        <div id="reason-container" class="reason-box" style="display: none;"></div>

        <div id="error-container" style="display: none;"></div>

        <a href="https://meeting.pulseedu.online" class="btn">Return to Meeting Portal</a>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const reason = urlParams.get('reason');
        const headingEl = document.getElementById('card-heading');
        if (reason) {
            const reasonEl = document.getElementById('reason-container');
            reasonEl.innerText = reason;
            reasonEl.style.display = 'block';
        } else if (!urlParams.get('errors')) {
            headingEl.innerText = 'PulseEdu Virtual Classroom';
        }

        const errorsParam = urlParams.get('errors');
        if (errorsParam) {
            try {
                const errors = JSON.parse(errorsParam);
                const errorContainer = document.getElementById('error-container');
                errorContainer.className = 'error-div';
                errorContainer.innerHTML = '<strong>An error occurred:</strong>';
                for (const err of errors) {
                    const p = document.createElement('p');
                    p.className = 'error-message';
                    p.innerText = err.message || JSON.stringify(err);
                    errorContainer.appendChild(p);
                }
                errorContainer.style.display = 'block';
            } catch (e) {}
        }
    </script>
</body>
</html>
