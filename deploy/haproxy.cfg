global
    log /dev/log local0
    log /dev/log local1 notice
    chroot /var/lib/haproxy
    user haproxy
    group haproxy
    daemon
    maxconn 4096
    ssl-default-bind-ciphers PROFILE=SYSTEM
    ssl-default-bind-options ssl-min-ver TLSv1.2 no-tls-tickets

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    option  forwardfor
    option  http-server-close
    timeout connect 5000ms
    timeout client  50000ms
    timeout server  50000ms
    timeout tunnel  3600s

frontend pulseedu_in
    bind :80
    bind :443 ssl crt /etc/ssl/pulseedu/pulseedu.pem alpn h2,http/1.1
    http-request redirect scheme https unless { ssl_fc }

    http-request set-header X-Forwarded-Proto https if { ssl_fc }
    http-request set-header X-Forwarded-Proto http unless { ssl_fc }
    http-request set-header X-Real-IP %[src]

    acl is_websocket hdr(Upgrade) -i WebSocket
    use_backend nextjs_cluster if is_websocket

    default_backend nextjs_cluster

backend nextjs_cluster
    balance roundrobin
    option httpchk GET /api/auth/me
    http-check expect rstatus (200|401)
    cookie SERVERID insert indirect nocache
    server nextjs_app_1 127.0.0.1:4444 check inter 3000ms rise 2 fall 3
